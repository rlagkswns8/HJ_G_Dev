<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>자이로 서바이벌 - 사이트를 옮겼어요</title>
<style>
  :root { --accent1:#ff5566; --accent2:#ff8a5b; }
  html, body { margin:0; padding:0; height:100%; background:#05060a; color:#fff; overflow:hidden;
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Helvetica Neue", sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body { display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #131826 0%, #05060a 75%); }
  canvas#bg { position:fixed; inset:0; width:100%; height:100%; z-index:0; }
  .wrap { position:relative; z-index:1; width:100%; max-width:360px; padding:24px 20px;
    padding-top:max(24px, env(safe-area-inset-top)); padding-bottom:max(24px, env(safe-area-inset-bottom));
    box-sizing:border-box; text-align:center; }
  h1 { margin:0 0 6px; font-size:30px; font-weight:800; letter-spacing:1px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .orb { width:26px; height:26px; border-radius:50%; flex:none;
    background: radial-gradient(circle at 35% 30%, #ff8a9a 0%, #ff2a44 45%, #a5001a 100%);
    box-shadow: 0 0 14px rgba(255,60,80,0.8), 0 0 30px rgba(255,60,80,0.35); }
  .en { color:#7f8796; font-size:12px; letter-spacing:2px; margin-bottom:34px; }
  .card { background:rgba(14,17,26,0.82); border:1px solid rgba(255,255,255,0.1); border-radius:18px;
    padding:22px 18px 20px; box-shadow:0 10px 40px rgba(0,0,0,0.45); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .badge { display:inline-block; font-size:11px; font-weight:700; color:#ffd166; background:rgba(255,209,102,0.1);
    border:1px solid rgba(255,209,102,0.35); padding:4px 10px; border-radius:20px; margin-bottom:14px; }
  .msg { font-size:17px; font-weight:700; line-height:1.5; margin:0 0 6px; }
  .sub { font-size:13px; color:#aab2c0; line-height:1.6; margin:0 0 18px; }
  .url { font-size:12.5px; color:#7dd3fc; background:rgba(125,211,252,0.08); border:1px solid rgba(125,211,252,0.25);
    border-radius:10px; padding:8px 10px; margin-bottom:18px; word-break:break-all; -webkit-user-select:text; user-select:text; }
  .go { display:block; width:100%; padding:16px 0; border:none; border-radius:30px; cursor:pointer; text-decoration:none;
    background:linear-gradient(135deg, var(--accent1), var(--accent2)); color:#fff; font-size:18px; font-weight:800; letter-spacing:1px;
    box-shadow:0 6px 24px rgba(255,85,102,0.45); transition:transform .12s; font-family:inherit; }
  .go:active { transform:scale(0.97); }
  .go small { display:block; font-size:11px; font-weight:600; opacity:0.85; letter-spacing:0; margin-top:2px; }
  .note { font-size:11.5px; color:#7f8796; line-height:1.6; margin-top:14px; }
  .music { margin-top:26px; display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:18px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16); color:#dfe4ea; font-size:12px; cursor:pointer; font-family:inherit; }
  .music .dot { width:8px; height:8px; border-radius:50%; background:#6b7280; }
  .music.on .dot { background:#7cff6b; box-shadow:0 0 8px #7cff6b; }
  .hint { font-size:10.5px; color:#5a6170; margin-top:8px; min-height:14px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <h1><span class="orb"></span>자이로 서바이벌</h1>
  <div class="en">GYRO SURVIVAL</div>
  <div class="card">
    <div class="badge">📢 안내 · Notice</div>
    <p class="msg">게임 사이트를 옮겼어요!</p>
    <p class="sub">이제 아래 새 사이트에서 플레이할 수 있어요.<br>
      업데이트도 앞으로 새 사이트에만 올라가요.<br>
      <span style="color:#7f8796;font-size:11.5px;">The game has moved to a new site.</span></p>
    <div class="url">hazeg.itch.io/gyro-survival</div>
    <a class="go" id="goBtn" href="https://hazeg.itch.io/gyro-survival" target="_top" rel="noopener">새 사이트로 이동 →<small>Go to the new site</small></a>
    <div class="note">💾 예전 기록을 게임 안 "진행도 서버 저장/불러오기"로 저장해두었다면, 새 사이트에서 그대로 불러올 수 있어요.</div>
  </div>
  <button class="music" id="musicBtn"><span class="dot"></span><span id="musicLabel">🎵 로비 음악: 켜짐</span></button>
  <div class="hint" id="musicHint"></div>
</div>
<script>
(function(){
  // ---------- background: drifting red dots + grid floor (like the game's menu) ----------
  const cv = document.getElementById('bg'), g = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize(){ DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
  addEventListener('resize', resize); resize();
  const dots = Array.from({length: 14}, () => ({ x: Math.random(), y: Math.random(), s: 0.02 + Math.random() * 0.05, r: 2 + Math.random() * 3, a: Math.random() * Math.PI * 2 }));
  const stars = Array.from({length: 70}, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + 0.2, t: Math.random() * 6 }));
  let last = performance.now();
  function frame(now){
    const dt = Math.min(50, now - last) / 1000; last = now;
    g.clearRect(0, 0, W, H);
    for (const s of stars){ g.globalAlpha = 0.25 + 0.25 * Math.sin(now / 900 + s.t); g.fillStyle = '#cfd8ff'; g.beginPath(); g.arc(s.x * W, s.y * H, s.r, 0, 7); g.fill(); }
    g.globalAlpha = 1;
    // perspective grid at the bottom
    const hy = H * 0.72;
    g.strokeStyle = 'rgba(255,60,90,0.16)'; g.lineWidth = 1;
    const off = (now / 2400) % 1;
    for (let i = 0; i < 10; i++){ const k = (i + off) / 10; const y = hy + (H - hy) * k * k; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let i = -10; i <= 10; i++){ g.beginPath(); g.moveTo(W / 2 + i * 14, hy); g.lineTo(W / 2 + i * W * 0.18, H); g.stroke(); }
    // falling red comets
    for (const d of dots){
      d.y += d.s * dt; d.x += Math.sin(now / 1500 + d.a) * 0.004 * dt;
      if (d.y > 1.05){ d.y = -0.05; d.x = Math.random(); }
      const x = d.x * W, y = d.y * H;
      const tr = g.createLinearGradient(x, y - 40, x, y);
      tr.addColorStop(0, 'rgba(255,60,90,0)'); tr.addColorStop(1, 'rgba(255,60,90,0.35)');
      g.strokeStyle = tr; g.lineWidth = d.r * 0.8; g.beginPath(); g.moveTo(x, y - 40); g.lineTo(x, y); g.stroke();
      g.fillStyle = 'rgba(255,70,95,0.75)'; g.shadowColor = '#ff3355'; g.shadowBlur = 10;
      g.beginPath(); g.arc(x, y, d.r, 0, 7); g.fill(); g.shadowBlur = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- lobby music: "출격 대기" (same procedural track as the game) ----------
  let ac = null, bus = null;
  const MUSIC_KEY = 'gyroMovedPageMusicOn';
  let musicOn = true;
  try { musicOn = localStorage.getItem(MUSIC_KEY) !== '0'; } catch(e){}
  function playTone(freq, dur, type, vol, freqEnd, delay){
    const t0 = ac.currentTime + (delay || 0);
    const osc = ac.createOscillator(), gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(bus);
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  function playNoise(dur, vol, filterFreq, filterType, delay){
    const n = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = filterType || 'lowpass'; f.frequency.value = filterFreq || 1200;
    const gain = ac.createGain(); const t0 = ac.currentTime + (delay || 0);
    gain.gain.setValueAtTime(vol, t0); gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(gain); gain.connect(bus); src.start(t0);
  }
  const NOTE = (() => {
    const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const m = {};
    for (let o = 1; o <= 7; o++) names.forEach((nm, i) => { m[nm + o] = 440 * Math.pow(2, ((o + 1) * 12 + i - 69) / 12); });
    m['Db4'] = m['C#4']; m['Eb4'] = m['D#4']; m['Bb3'] = m['A#3']; m['Bb4'] = m['A#4']; m['Eb5'] = m['D#5']; m['Bb2'] = m['A#2'];
    return m;
  })();
  const n = s => NOTE[s];
  // ---------------- B. 출격 대기 (synthwave, upbeat) ----------------
  // 108 BPM, tick = 16th. 8 bars x 16 = 128 ticks (~17.8s) per loop.
  const B_CHORDS = [
    ['A3','C4','E4'], ['F3','A3','C4'], ['C4','E4','G4'], ['G3','B3','D4'],
    ['A3','C4','E4'], ['F3','A3','C4'], ['D4','F4','A4'], ['E3','G#3','B3'],
  ];
  const B_ROOT = ['A1','F1','C2','G1','A1','F1','D2','E2'];
  const B_ARP = [0,1,2,1, 0,1,2,3, 0,1,2,1, 2,1,0,1];
  // lead: [bar, tick16, note, len16]
  const B_LEAD = [
    [0,0,'E5',6],[0,6,'A5',4],[0,10,'G5',2],[0,12,'E5',4],
    [1,0,'F5',6],[1,6,'C5',2],[1,8,'A4',8],
    [2,0,'G5',6],[2,6,'E5',4],[2,10,'C5',2],[2,12,'D5',4],
    [3,0,'B4',8],[3,8,'D5',4],[3,12,'G5',4],
    [4,0,'A5',6],[4,6,'C6',4],[4,10,'B5',2],[4,12,'A5',4],
    [5,0,'F5',6],[5,6,'A5',2],[5,8,'C6',8],
    [6,0,'D6',4],[6,4,'C6',4],[6,8,'A5',4],[6,12,'F5',4],
    [7,0,'E5',4],[7,4,'G#5',4],[7,8,'B5',8],
  ];
  const trackB = {
    name: 'B_launch_standby', tickDur: 139, ticks: 128,
    step(i, ts, T, N){
      const bar = Math.floor(i / 16), tk = i % 16;
      const ch = B_CHORDS[bar].map(n);
      const root = n(B_ROOT[bar]);
      if (tk === 0) ch.forEach(f => T(f, ts * 16, 'sawtooth', 0.0065)); // soft saw pad
      if (tk === 0) ch.forEach(f => T(f, ts * 16, 'triangle', 0.016));
      if (tk % 4 === 0) T(70, 0.26, 'sine', 0.055, 38);                 // kick
      if (tk === 4 || tk === 12){ N(0.14, 0.05, 2000, 'bandpass'); T(200, 0.07, 'triangle', 0.025, 110); } // snare
      if (tk % 2 === 0) N(0.03, tk % 4 === 2 ? 0.020 : 0.012, 8000, 'highpass'); // hats
      // pulsing octave bass on 8ths
      if (tk % 2 === 0) T(tk % 4 === 0 ? root : root * 2, ts * 1.7, 'triangle', 0.050);
      // 16th arp, quiet square
      T(ch[B_ARP[tk] % ch.length] * (B_ARP[tk] === 3 ? 4 : 2), ts * 0.9, 'square', 0.0085);
      for (const [b, t, note, len] of B_LEAD){
        if (b === bar && t === tk){
          T(n(note), ts * len * 0.95, 'triangle', 0.034);
          T(n(note) * 1.003, ts * len * 0.95, 'sawtooth', 0.006);        // slight chorus edge
        }
      }
      if (bar === 7 && tk >= 12) N(0.06, 0.02 + (tk - 12) * 0.006, 3000, 'highpass'); // fill into loop
    }
  };

  const TRACK = trackB;
  let tick = 0, nextTime = 0, timer = 0;
  function schedule(){
    const tickSec = TRACK.tickDur / 1000;
    while (nextTime < ac.currentTime + 0.25){
      const off = Math.max(0, nextTime - ac.currentTime);
      TRACK.step(tick % TRACK.ticks, tickSec,
        (f, d, ty, v, fe, dl) => playTone(f, d, ty, v, fe, (dl || 0) + off),
        (d, v, ff, ft, dl) => playNoise(d, v, ff, ft, (dl || 0) + off));
      tick++; nextTime += tickSec;
    }
  }
  function startMusic(){
    if (!musicOn) return;
    try {
      if (!ac){ ac = new (window.AudioContext || window.webkitAudioContext)(); bus = ac.createGain(); bus.gain.value = 0; bus.connect(ac.destination); }
      if (ac.state === 'suspended') ac.resume();
    } catch(e){ return; }
    if (timer) return;
    nextTime = ac.currentTime + 0.08; tick = 0;
    bus.gain.cancelScheduledValues(ac.currentTime);
    bus.gain.setValueAtTime(bus.gain.value, ac.currentTime);
    bus.gain.linearRampToValueAtTime(1, ac.currentTime + 1.5);   // fade in
    timer = setInterval(schedule, 40); schedule();
    updateHint();
  }
  function stopMusic(){
    if (!ac || !timer) return;
    clearInterval(timer); timer = 0;
    bus.gain.cancelScheduledValues(ac.currentTime);
    bus.gain.setValueAtTime(bus.gain.value, ac.currentTime);
    bus.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);   // fade out
  }
  const btn = document.getElementById('musicBtn'), label = document.getElementById('musicLabel'), hint = document.getElementById('musicHint');
  function updateUI(){ btn.classList.toggle('on', musicOn); label.textContent = musicOn ? '🎵 로비 음악: 켜짐' : '🎵 로비 음악: 꺼짐'; updateHint(); }
  function updateHint(){
    const playing = !!(ac && timer && ac.state === 'running');
    hint.textContent = (musicOn && !playing) ? '화면을 한 번 누르면 음악이 나와요' : '';
  }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    musicOn = !musicOn;
    try { localStorage.setItem(MUSIC_KEY, musicOn ? '1' : '0'); } catch(err){}
    if (musicOn) startMusic(); else stopMusic();
    updateUI();
  });
  // browsers only allow sound after the first touch/click/key
  const kick = () => { if (musicOn){ startMusic(); setTimeout(updateHint, 200); } };
  ['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, kick, { passive: true }));
  document.getElementById('goBtn').addEventListener('click', stopMusic);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopMusic(); else if (musicOn && ac) startMusic(); });
  updateUI();
  startMusic();                      // works where autoplay is allowed
  setTimeout(updateHint, 400);
})();
</script>
</body>
</html>
